# Custom CSS/JS, paths relative to docs_dir.
# Read more: https://zensical.org/docs/customization/#additional-css
extra_css = [
    "stylesheets/uforge-home.css",
    "stylesheets/hardware-overview.css",
    "stylesheets/extra.css",
]
#extra_javascript = ["javascripts/extra.js"]

#last_updated = "true"
#[project.last_updated]
#format = "Last updated %B %d, %Y"

# ----------------------------------------------------------------------------
[project.theme]

#variant = "classic"  # traditional Material for MkDocs look

# Template overrides. Read more: https://zensical.org/docs/customization/#extending-the-theme
custom_dir = "overrides"

# Favicon path, relative to docs_dir.
# Read more: https://zensical.org/docs/setup/logo-and-icons/#favicon
favicon = "assets/uforge-favicon.svg"

# UI language -- translates theme chrome (60+ languages supported), one per
# build. Read more: https://zensical.org/docs/setup/language/
language = "en"

# Feature toggles. See https://zensical.org/docs/setup/ for what each does.
features = [
    "announce.dismiss",            # dismissible announcement bar
    #"content.action.edit",        # edit-this-page button
    #"content.action.view",        # view-source button
    "content.code.annotate",       # code annotation tooltips
    "content.code.copy",           # copy-to-clipboard on code blocks
    "content.code.select",         # line-range selection in code blocks
    "content.footnote.tooltips",   # inline footnote tooltips
    "content.tabs.link",           # linked content tabs
    "content.tooltips",            # link hover tooltips
    # "header.autohide",           # auto-hide header on scroll
    # "navigation.expand",         # expand all nav sections by default
    "navigation.footer",           # prev/next footer links
    "navigation.indexes",          # section index pages
    "navigation.instant",          # instant (XHR) navigation
    "navigation.instant.prefetch", # prefetch on hover
    #"navigation.instant.progress",# loading progress bar
    "navigation.path",             # breadcrumbs
    #"navigation.prune",           # prune hidden nav items from HTML
    "navigation.sections",         # top-level nav as sidebar groups
    "navigation.tabs",             # top-level nav as header tabs
    #"navigation.tabs.sticky",     # sticky header tabs
    "navigation.top",              # back-to-top button
    "navigation.tracking",         # URL anchor tracking
    "search.highlight",            # highlight search terms on click-through
    # "toc.follow",                # auto-scroll sidebar toc
    #"toc.integrate",              # merge toc into nav sidebar
]

# Header logo, relative to docs_dir.
logo = "assets/uforge-logo.svg"

[project.theme.icon]
repo = "fontawesome/brands/github"
alternate = "lucide/languages"
#logo = "lucide/smile"

#[project.theme.font]
text = "Josefin Sans"
code = "Jetbrains Mono"

# Color palette. Read more: https://zensical.org/docs/setup/colors/
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "System"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Light"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Dark"

# Language switcher entries (name/lang shown in the header dropdown). The
# actual per-page target URL is computed in overrides/partials/alternate.html
# and overrides/main.html, not from the "link" value below -- see AGENTS.md's
# "Language switcher" section.
[[project.extra.alternate]]
name = "EN"
link = "/"
lang = "en"


[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:contact@uforge.io"
name = "Contact μForge.io"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/uforge-io/"
name = "Go to GitHub"

[[project.extra.social]]
icon = "simple/taobao"
link = "https://sifli.taobao.com/"
name = "SiFli Taobao Store"

[project.extra.analytics]
provider = "google"
property = "G-NN1VWVS9D7"

# Markdown extensions. Read more: https://zensical.org/docs/setup/extensions/
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
fractions = false
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
