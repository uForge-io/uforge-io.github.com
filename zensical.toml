[project]

site_name = "μForge.io"

site_description = "μForge.io documents SF32 ultra-low-power microcontrollers, modules, development boards, SDK workflows, and production-ready hardware design guides for embedded developers."

site_author = "Jingming Wang"

site_url = "https://uForge.io/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io - <a href='mailto:contact@uforge.io'>Contact Us</a>
"""

